<canvas id="canvas" width="904" height="904" style="position:absolute; left:0px; top:0px;"></canvas>

<script>

// [#] id угла вычисляется как: 16*A + 4*B + C
//      B  |   C
//    -----|-------
//      A  | (угол)

// [#] A, B, C - клетки, они могут быть:
//    0 - пустая  клетка вне    микросхемы
//    1 - занятая клетка вне    микросхемы
//    2 - пустая  клетка внутри микросхемы
//    3 - занятая клетка внутри микросхемы

// [#] Положения точек (для построения границы) кодируются цифрами. Расположение цифр:
//    |---------|---------|
//    |         |         |
//    |     3   4   5     |
//    |         |         |
//    |-----2---0---------|
//    |         |
//    |     1   |  (угол)
//    |         |
//    |---------|


// Вручную добытые данные, прям физически из бумаги лол
// ( где: inverted_arr[:][0] - список точек  для  построения границы )
// (      inverted_arr[:][1] - список id углов имеющих такую границу )
let inverted_arr = [
    [ [0],     [17, 49, 51, 21, 53, 55, 25, 57, 59, 29, 61, 63] ],
    [ [3],     [0, 32, 34, 8, 40, 42] ],
    [ [4],     [16, 48, 50, 54, 56, 58, 22] ],    
    [ [0,5],   [20, 52, 28, 60, 62, 30] ],
    [ [1,5],   [4, 12, 44, 46] ],
    [ [3,0],   [33] ],
    [ [2,0,5], [36] ],
    [ [2,0,4], [38] ],
    [ [0,2,3], [24, 26] ],
];

// ----- (дальше без "читаемости") ----------------------------------------------------------------


function compose(A, B, C) { return 16*A + 4*B + C;}
function parse  (num)     { return [(num>>4)%4, (num>>2)%4, num%4]; }


// Для каждого варианта угла выделено четыре позиции. Не заполненые позиции заполняются -1.
function create_arr() {
    const arr = new Int8Array(64*4);
    for(let i = 0; i < 64*4; i++) arr[i] = -1;

    function arr_set(id, dots) {
        for(let i = 0; i < dots.length; i++)
            arr[4*id + i] = dots[i];
    }

    function invert(dots) {
        let idots = [];
        for(let i = dots.length-1; i >= 0; i--) {
            // зеркальная точка
            idots.push( (6-dots[i])%6 );
        }
        return idots;
    }

    for(let [dots, ids] of inverted_arr) {
        let idots = invert(dots);
        for(let id of ids) {
            arr_set(id, dots);
            
            let [A, B, C] = parse(id);
            if( A == C ) continue;
            
            arr_set(compose(C, B, A), idots);
        }
    }
    return arr;
}

const arr = create_arr();
console.log(arr);





function tile(x, y, a, T, ctx) {
    let r = 0.15;
    if( T == 0 ) {
        ctx.strokeStyle = 'green';
        ctx.strokeRect(x + r*a, y + r*a, (1-2*r)*a, (1-2*r)*a);
    }
    if( T == 1 ) {
        ctx.strokeStyle = 'red';
        let x1 = x + r*a, y1 = y + r*a, x2 = x + (1-r)*a, y2 = y + (1-r)*a;
        ctx.strokeRect(x1, y1, (1-2*r)*a, (1-2*r)*a);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.moveTo(x1, y2);
        ctx.lineTo(x2, y1);
        ctx.stroke();
    }
    if( T == 2 ) {
        
    }
    if( T == 3 ) {
        ctx.fillStyle = 'darkgray';
        ctx.fillRect(x, y, a, a);
    }
}


function sector(x, y, a, num, ctx = canvas.getContext('2d')) {
    let [A, B, C] = parse(num);

    tile(x  , y+a, a, A, ctx);
    tile(x  , y  , a, B, ctx);
    tile(x+a, y  , a, C, ctx);

    ctx.fillStyle = 'dimgray';
    ctx.fillRect(x+a, y+a, a, a);

    ctx.strokeStyle = 'black';
    ctx.strokeRect(x, y, 2*a, 2*a);
    ctx.beginPath();
    ctx.moveTo(x+a  , y    );
    ctx.lineTo(x+a  , y+2*a);
    ctx.moveTo(x    , y+a  );
    ctx.lineTo(x+2*a, y+a  );
    ctx.stroke();


    // РИСУЕМ ГРАНИЦУ
    ctx.strokeStyle = 'red';
    let h = 0.35;  // отсут от стороны

    function dpos(num) {
        let dx = 0, dy = 0;
        if( 1 <= num && num <= 3 ) dx = -1;
        if( num == 5 ) dx = +1;
        if( 3 <= num && num <= 5 ) dy = -1;
        if( num == 1 ) dy = +1;
        return [dx, dy];
    }

    // список точек: [ arr[p], arr[p+1], ..., arr[p+l] )
    let p = 4*num, l = 1;
    while( arr[p+l] != -1 ) l++;

    ctx.beginPath();
    ctx.moveTo(x+a - (arr[p] != 0 && arr[p] != 4)*h*a, y+2*a);
    for(let i = 0; i < l; i++) {
        let [dx, dy] = dpos(arr[p+i]);
        ctx.lineTo(x+a + dx*h*a, y+a + dy*h*a);
    }
    ctx.lineTo(x+2*a, y+a - (arr[p+l-1] != 0 && arr[p+l-1] != 2)*h*a);

    let w = ctx.lineWidth;
    ctx.lineWidth = 2*w;
    ctx.stroke();
    ctx.lineWidth = w;

    let info = 'draw ' + String(A) + " " + String(B) + " " + String(C) + " " + String(num) + " | ";
    for(let i = 0; i < l; i++) info += String(arr[p+i]) + (i+1 != l ? ", " : "");
    // console.log(info);
}

let A = 50;

let order = [0, 2, 1, 3];
function f1(x, y, num) {
    for(let i = 0; i < 4; i++) sector(x + i*(2.2*A), y, A, num + 16*order[i]);
}

function f2(x, y, num) {
    for(let i = 0; i < 4; i++) f1(x, y + i*(2.2*A), num + order[i]);
}

let df2 = 0.5;
f2(4.5                    , 4.5                    , 4*0);
f2(4.5 + 4*(2.2*A) + df2*A, 4.5                    , 4*1);
f2(4.5                    , 4.5 + 4*(2.2*A) + df2*A, 4*2);
f2(4.5 + 4*(2.2*A) + df2*A, 4.5 + 4*(2.2*A) + df2*A, 4*3);


</script>
